<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — EvenCard</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de EvenCard -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-light">

    <!-- NAVBAR DASHBOARD -->
    <header class="dashboard-navbar shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html">
                <div class="bg-primary text-white rounded-3 p-1 d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
                    <i class="bi bi-envelope-heart-fill"></i>
                </div>
                <span class="fs-4 text-dark">Even<span class="text-primary">Card</span></span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="dashboard.html" class="btn btn-sm btn-light">
                    <i class="bi bi-arrow-left me-1"></i> Volver al panel
                </a>
                <button class="btn btn-sm btn-outline-danger" onclick="window.Auth.logout()">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </button>
            </div>
        </div>
    </header>

    <div class="container py-5" style="max-width: 720px;">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mb-4">
            <div class="d-flex align-items-center gap-4 mb-4 pb-3 border-bottom">
                <div class="position-relative">
                    <img id="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" 
                         class="rounded-circle border border-3 border-primary shadow-sm object-fit-cover" 
                         style="width: 86px; height: 86px;" alt="Avatar">
                    <label for="avatar-input" class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle p-1 d-flex align-items-center justify-content-center shadow" 
                           style="width: 28px; height: 28px; cursor: pointer;" title="Cambiar avatar">
                        <i class="bi bi-camera-fill small"></i>
                    </label>
                    <input type="file" id="avatar-input" class="d-none" accept="image/*">
                </div>
                <div>
                    <h4 class="fw-bold text-dark mb-1" id="profile-name">Cargando...</h4>
                    <span class="text-secondary small d-block" id="profile-email">...</span>
                </div>
            </div>

            <form id="profile-form">
                <h5 class="fw-bold text-dark mb-3">Información personal</h5>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="first-name">Nombre</label>
                        <input type="text" class="form-control" id="first-name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="last-name">Apellido</label>
                        <input type="text" class="form-control" id="last-name" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="phone">Teléfono / WhatsApp</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+51 987654321">
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4" id="btn-save-profile">
                        Guardar cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>

    <script>
        let currentUserId = null;
        let currentAvatarUrl = '';

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await window.Auth.requireAuth('login.html');
            if (!user) return;
            currentUserId = user.id;

            document.getElementById('profile-email').textContent = user.email;

            const profile = await window.Auth.getProfile(user.id);
            if (profile) {
                document.getElementById('first-name').value = profile.first_name || '';
                document.getElementById('last-name').value = profile.last_name || '';
                document.getElementById('phone').value = profile.phone || '';
                document.getElementById('profile-name').textContent = `${profile.first_name || ''} ${profile.last_name || ''}`.trim() || user.email.split('@')[0];

                if (profile.avatar_url) {
                    document.getElementById('avatar-img').src = profile.avatar_url;
                    currentAvatarUrl = profile.avatar_url;
                }
            }
        });

        // Subir avatar
        document.getElementById('avatar-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                window.Utils.showToast('Subiendo avatar...', 'info');
                const uploaded = await window.Storage.uploadImage(window.CONFIG.BUCKETS.AVATARS, file, 'profile');
                currentAvatarUrl = uploaded.publicUrl;
                document.getElementById('avatar-img').src = currentAvatarUrl;
                window.Utils.showToast('Avatar actualizado en la vista. Guarda los cambios para persistir.', 'success');
            } catch (err) {
                console.error(err);
                window.Utils.showToast(err.message || 'Error al subir el avatar.', 'danger');
            }
        });

        // Guardar cambios
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-profile');
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const phone = document.getElementById('phone').value.trim();

            try {
                window.Utils.setLoadingButton(btn, true, 'Guardando...');
                await window.Auth.updateProfile({
                    firstName,
                    lastName,
                    phone,
                    avatarUrl: currentAvatarUrl
                });
                document.getElementById('profile-name').textContent = `${firstName} ${lastName}`;
                window.Utils.showToast('Perfil actualizado con éxito.', 'success');
            } catch (err) {
                console.error('Error al guardar perfil:', err);
                window.Utils.showToast('No se pudieron guardar los cambios.', 'danger');
            } finally {
                window.Utils.setLoadingButton(btn, false);
            }
        });
    </script>
</body>
</html>
