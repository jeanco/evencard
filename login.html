<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — EvenCard</title>
    <meta name="description" content="Inicia sesión en tu cuenta de EvenCard y administra tus invitaciones digitales.">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de EvenCard -->
    <link rel="stylesheet" href="css/app.css">
    <style>
        body {
            background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            max-width: 460px;
            width: 100%;
            background: #FFFFFF;
            border-radius: var(--ec-radius-xl);
            box-shadow: 0 20px 40px -15px rgba(108, 99, 255, 0.12);
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 2.5rem;
        }
        @media (max-width: 576px) {
            .auth-card {
                padding: 1.8rem 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Logo -->
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
                <div class="bg-primary text-white rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px;">
                    <i class="bi bi-envelope-heart-fill fs-4"></i>
                </div>
                <span class="fs-3 fw-bold text-dark" style="letter-spacing: -0.5px;">Even<span class="text-primary">Card</span></span>
            </a>
            <h4 class="fw-bold text-dark mb-1">¡Te damos la bienvenida!</h4>
            <p class="text-secondary small mb-0">Inicia sesión para administrar tus invitaciones</p>
        </div>

        <!-- Formulario -->
        <form id="login-form" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="tu@correo.com" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0" for="password">Contraseña</label>
                    <a href="#" class="text-primary small text-decoration-none" onclick="handleForgotPassword(event)">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="Tu contraseña" required>
                    <button class="btn btn-light border border-start-0" type="button" onclick="togglePassword('password', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember-me" checked>
                <label class="form-check-label text-secondary small" for="remember-me">
                    Recordarme en este dispositivo
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 mb-3 shadow" id="btn-submit">
                Iniciar sesión
            </button>

            <div class="text-center">
                <span class="text-secondary small">¿Aún no tienes cuenta? </span>
                <a href="registro.html" class="text-primary fw-semibold small text-decoration-none">Crear una cuenta</a>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.Auth.redirectIfAuth('dashboard.html');
        });

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                window.Utils.showToast('Ingresa tu correo para enviarte el enlace de recuperación.', 'warning');
                return;
            }
            window.Utils.showToast('Si la cuenta existe, se ha enviado un correo con instrucciones.', 'info');
        }

        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('btn-submit');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                window.Utils.showToast('Por favor completa todos los campos.', 'warning');
                return;
            }

            try {
                window.Utils.setLoadingButton(submitBtn, true, 'Verificando credenciales...');
                await window.Auth.login(email, password);

                window.Utils.showToast('¡Bienvenido de vuelta!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } catch (err) {
                console.error('Error al iniciar sesión:', err);
                let msg = 'Credenciales incorrectas. Verifica tu correo y contraseña.';
                if (err.message && err.message.includes('Invalid login credentials')) {
                    msg = 'El correo o la contraseña son incorrectos.';
                } else if (err.message && err.message.includes('Email not confirmed')) {
                    msg = 'Por favor verifica tu correo electrónico antes de ingresar.';
                }
                window.Utils.showToast(msg, 'danger');
            } finally {
                window.Utils.setLoadingButton(submitBtn, false);
            }
        });
    </script>
</body>
</html>
