<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — EvenCard</title>
    <meta name="description" content="Regístrate en EvenCard y comienza a crear hermosas invitaciones digitales en minutos.">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de EvenCard -->
    <link rel="stylesheet" href="css/app.css">
    <style>
        body {
            background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            max-width: 520px;
            width: 100%;
            background: #FFFFFF;
            border-radius: var(--ec-radius-xl);
            box-shadow: 0 20px 40px -15px rgba(108, 99, 255, 0.12);
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 2.5rem;
        }
        @media (max-width: 576px) {
            .auth-card {
                padding: 1.8rem 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Logo -->
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
                <div class="bg-primary text-white rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px;">
                    <i class="bi bi-envelope-heart-fill fs-4"></i>
                </div>
                <span class="fs-3 fw-bold text-dark" style="letter-spacing: -0.5px;">Even<span class="text-primary">Card</span></span>
            </a>
            <h4 class="fw-bold text-dark mb-1">Crea tu cuenta gratis</h4>
            <p class="text-secondary small mb-0">Empieza a diseñar invitaciones digitales interactivas</p>
        </div>

        <!-- Formulario -->
        <form id="register-form" novalidate>
            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label" for="first-name">Nombre <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="first-name" placeholder="Ej: María" required>
                </div>
                <div class="col-6">
                    <label class="form-label" for="last-name">Apellido <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="last-name" placeholder="Ej: Gómez" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="phone">Teléfono / WhatsApp</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-whatsapp"></i></span>
                    <input type="tel" class="form-control border-start-0" id="phone" placeholder="+51 987654321">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="tu@correo.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Contraseña <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="Mínimo 6 caracteres" required>
                    <button class="btn btn-light border border-start-0" type="button" onclick="togglePassword('password', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirm-password">Confirmar contraseña <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0" id="confirm-password" placeholder="Repite tu contraseña" required>
                    <button class="btn btn-light border border-start-0" type="button" onclick="togglePassword('confirm-password', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label text-secondary small" for="terms">
                    Acepto los <a href="#" class="text-primary text-decoration-none">términos y condiciones</a> y la <a href="#" class="text-primary text-decoration-none">política de privacidad</a>.
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 mb-3 shadow" id="btn-submit">
                Crear cuenta
            </button>

            <div class="text-center">
                <span class="text-secondary small">¿Ya tienes una cuenta? </span>
                <a href="login.html" class="text-primary fw-semibold small text-decoration-none">Iniciar sesión</a>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Si ya está autenticado, redirigir al dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            await window.Auth.redirectIfAuth('dashboard.html');
        });

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        const registerForm = document.getElementById('register-form');
        const submitBtn = document.getElementById('btn-submit');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const terms = document.getElementById('terms').checked;

            if (!firstName || !lastName || !email || !password) {
                window.Utils.showToast('Por favor completa todos los campos obligatorios.', 'warning');
                return;
            }

            if (password.length < 6) {
                window.Utils.showToast('La contraseña debe tener al menos 6 caracteres.', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                window.Utils.showToast('Las contraseñas no coinciden.', 'danger');
                return;
            }

            if (!terms) {
                window.Utils.showToast('Debes aceptar los términos y condiciones.', 'warning');
                return;
            }

            try {
                window.Utils.setLoadingButton(submitBtn, true, 'Creando tu cuenta...');
                const data = await window.Auth.register({
                    firstName,
                    lastName,
                    phone,
                    email,
                    password
                });

                // Caso A: Supabase tiene "Confirm email" ACTIVO → no hay sesión aún
                if (!data.session) {
                    window.Utils.showToast(
                        '¡Cuenta creada! Revisa tu correo para confirmar tu cuenta y luego inicia sesión.',
                        'success'
                    );
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2500);
                    return;
                }

                // Caso B: Auto-confirm activo → hay sesión inmediata → ir al dashboard
                window.Utils.showToast('¡Cuenta creada con éxito! Redirigiendo...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (err) {
                console.error('Error al registrar usuario:', err);
                let msg = err.message || 'No se pudo crear la cuenta.';
                if (msg.includes('already registered') || msg.includes('already been registered')) {
                    msg = 'Este correo ya se encuentra registrado. Intenta iniciar sesión.';
                }
                window.Utils.showToast(msg, 'danger');
            } finally {
                window.Utils.setLoadingButton(submitBtn, false);
            }
        });
    </script>
</body>
</html>
